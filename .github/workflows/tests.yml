name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      POKERALPHA_SKIP_SLOW: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Non-slow test suite
        run: pytest -q

  vision-ui:
    name: vision + UI extras
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with optional extras (no Tesseract, no display needed)
        run: python -m pip install -e ".[dev,vision,ui,api]"
      - name: Full non-slow suite with the optional extras (observer, Streamlit AppTest)
        env:
          POKERALPHA_SKIP_SLOW: "1"
        run: pytest -q -rs

  native:
    name: native solver (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POKERALPHA_SKIP_SLOW: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with the native backend
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install ./cpp
      - name: Native test suite (parity, checkpoints, artifacts)
        run: pytest -q tests/test_native_evaluator.py tests/test_native_features.py tests/test_native_game_parity.py tests/test_native_mccfr_parity.py tests/test_native_checkpoint.py
      - name: Native validation command
        run: python experiments/validate_native_solver.py --hands 200 --iters 50
      - name: Doctor reports the backend
        run: python -m poker_alpha.doctor --no-capture || true

  native-macos:
    name: native solver (macOS arm64, build + smoke)
    runs-on: macos-14
    timeout-minutes: 20
    env:
      POKERALPHA_SKIP_SLOW: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with the native backend
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install ./cpp
      - name: Fast parity smoke (evaluator, features, mechanics, 10-iteration tape)
        run: pytest -q tests/test_native_evaluator.py tests/test_native_features.py "tests/test_native_mccfr_parity.py::test_single_trace_and_state_parity[10]"

  web:
    name: web frontend (TypeScript, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build

  desktop:
    name: desktop shell (TypeScript build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
