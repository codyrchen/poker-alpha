[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "poker-alpha-native"
version = "0.1.0"
description = "Native C++ MCCFR training backend for PokerAlpha (optional)"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.scikit-build]
minimum-version = "0.9"
cmake.version = ">=3.26"
build-dir = "build/{wheel_tag}"
wheel.license-files = []
